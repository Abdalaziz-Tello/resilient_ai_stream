# Publishes to pub.dev when a version tag such as v2.0.0 is pushed.
# Requires automated publishing to be enabled once on pub.dev:
# package page -> Admin -> Automated publishing -> GitHub Actions,
# repository Abdalaziz-Tello/resilient_ai_stream, tag pattern v{{version}}.
name: Publish to pub.dev
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
